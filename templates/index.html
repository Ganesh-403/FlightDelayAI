<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlightDelayAI | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <nav class="navbar">
        <div class="logo" style="font-weight: 800; font-size: 1.2rem; color: #818cf8;">FlightDelayAI</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="http://127.0.0.1:8050" target="_blank">Dashboard</a>
            <a href="/login">Admin</a>
        </div>
    </nav>

    <div class="main-content">
        <div class="container" style="margin: 0; width: 100%;">
            <div class="badge">AI Prediction Engine v2.0</div>
            <h1>Estimate Delay</h1>
            
            <form id="predictionForm">
                <div class="form-group">
                    <label for="airline">Airline</label>
                    <input type="text" id="airline" name="airline" placeholder="e.g. Emirates" required>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label for="origin">Origin</label>
                        <input type="text" id="origin" name="origin" placeholder="JFK" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="destination">Destination</label>
                        <input type="text" id="destination" name="destination" placeholder="LHR" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="flight_duration">Duration (min)</label>
                    <input type="number" id="flight_duration" name="flight_duration" placeholder="330" required>
                </div>
                
                <div class="form-group">
                    <label for="congestion">Congestion (1-10)</label>
                    <input type="number" id="congestion" name="congestion" placeholder="5" required>
                </div>
                
                <div class="form-group">
                    <label for="aircraft_type">Aircraft</label>
                    <input type="text" id="aircraft_type" name="aircraft_type" placeholder="Boeing 777" required>
                </div>
                
                <button type="button" onclick="predictDelay()">Analyze Flight</button>
            </form>

            <div id="result"></div>
        </div>

        <div class="recent-predictions">
            <h3 style="margin-bottom: 20px; font-size: 1rem; color: var(--text-main);">Recent Analysis</h3>
            <div id="recentList">
                <p style="color: var(--text-muted); font-size: 0.8rem;">Loading history...</p>
            </div>
        </div>
    </div>

    <script>
        // Fetch recent predictions on load
        function fetchRecent() {
            fetch("/recent_predictions")
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById("recentList");
                list.innerHTML = data.map(p => `
                    <div class="recent-item">
                        <div class="recent-info">
                            <strong style="color: white; font-size: 0.9rem;">${p.airline}</strong>
                            <span>${p.origin} → ${p.destination}</span>
                        </div>
                        <div class="recent-delay">${p.delay}m</div>
                    </div>
                `).join('') || '<p style="color: var(--text-muted);">No history yet.</p>';
            });
        }

        function predictDelay() {
            const resultDiv = document.getElementById("result");
            const btn = document.querySelector("button");
            
            btn.innerText = "Analyzing...";
            btn.disabled = true;

            const data = {
                airline: document.getElementById("airline").value,
                origin: document.getElementById("origin").value,
                destination: document.getElementById("destination").value,
                flight_duration: parseFloat(document.getElementById("flight_duration").value),
                congestion: parseFloat(document.getElementById("congestion").value),
                aircraft_type: document.getElementById("aircraft_type").value
            };

            fetch("/predict", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                resultDiv.innerHTML = `
                    <h2 style="font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">AI Result</h2>
                    <span class="prediction-value">${result.delay_prediction.toFixed(1)} <small style="font-size: 0.4em">min</small></span>
                `;
                resultDiv.classList.add("show");
                btn.innerText = "Analyze Flight";
                btn.disabled = false;
                fetchRecent(); // Refresh history
            })
            .catch(error => {
                console.error("Error:", error);
                btn.innerText = "Error - Try Again";
                btn.disabled = false;
            });
        }

        // Initialize
        fetchRecent();
    <footer style="position: fixed; bottom: 20px; left: 0; width: 100%; text-align: center; color: var(--text-muted); font-size: 0.8rem; z-index: 10;">
        &copy; 2026 FlightDelayAI &bull; Built with Deep Learning & Flask
    </footer>
</body>
</html>
